[project]
name = "matchr-backend"
version = "1.0.0"
description = "Matchr API — semantic resume screening with bi-encoder retrieval + cross-encoder reranking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sentence-transformers>=3.3.1",
    "supabase>=2.9.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "num2words>=0.5.14",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "httpx>=0.27.0",
    "huggingface-hub>=1.16.1",
    "pdfplumber>=0.11.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-jobspy>=1.1.82",
]

[tool.uv]

# Reuse system-installed torch/sentence-transformers to avoid downloading ~2 GB.
# The venv is created with --system-site-packages (see uv.toml).
# Docker build installs everything fresh from pyproject.toml (no space constraint there).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
